name: 입찰정보 자동수집 (매일 10시)

on:
  schedule:
    - cron: '33 5 * * 1-5'

  workflow_dispatch:
    inputs:
      lookback_days:
        description: '최근 며칠치를 수집할까요? (0 = 전날 10시~현재, 월요일은 금요일부터)'
        required: false
        default: '0'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 실행 정보 표시
        run: |
          echo "실행 방식 : ${{ github.event_name }}"
          echo "현재 UTC  : $(date -u '+%Y-%m-%d %H:%M')"
          echo "한국시간  : $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"

      - name: 입찰정보 수집 및 메일 발송
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '0' }}
        run: python main.py

      - name: 엑셀 파일 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bid-excel
          path: '*.xlsx'
          if-no-files-found: ignore
          retention-days: 30
