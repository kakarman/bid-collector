# =============================================================================
#  나라장터 입찰정보 자동 수집 (GitHub Actions)
#  - 매주 월~금 오전 10시(한국시간)에 자동 실행됩니다.
#  - 원할 때 언제든 깃허브에서 버튼을 눌러 즉시 실행할 수도 있습니다.
# =============================================================================

name: 나라장터 입찰정보 자동수집

on:
  # -------------------------------------------------------------------------
  # (1) 정해진 시간에 자동 실행
  #     ※ 깃허브는 UTC(세계표준시) 기준입니다. 한국시간 = UTC + 9시간
  #        한국시간 오전 10시  →  UTC 01시  →  '0 1 * * 1-5'
  #     ※ 시간을 바꾸고 싶다면 (원하는 한국시간 - 9) 를 계산해 넣으세요.
  #        예) 한국 오전 9시 → '0 0 * * 1-5'
  #            한국 오후 2시 → '0 5 * * 1-5'
  #     ※ 맨 뒤 '1-5' 는 월~금을 뜻합니다. (매일 원하면 '*' 로 변경)
  #     ※ 깃허브 서버가 붐비면 실제 실행이 5~20분 늦어질 수 있습니다(정상입니다).
  # -------------------------------------------------------------------------
  schedule:
    - cron: '0 1 * * 1-5'

  # -------------------------------------------------------------------------
  # (2) 수동 실행 버튼
  #     깃허브 저장소 → Actions 탭 → 왼쪽에서 이 워크플로 선택
  #     → 오른쪽 'Run workflow' 버튼 클릭
  # -------------------------------------------------------------------------
  workflow_dispatch:
    inputs:
      lookback_days:
        description: '최근 며칠치를 수집할까요? (0 = 기본 규칙: 전날 10시~현재, 월요일은 금요일부터)'
        required: false
        default: '0'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # (1) 저장소의 코드를 가져옵니다.
      - name: 코드 가져오기
        uses: actions/checkout@v4

      # (2) 파이썬을 설치합니다.
      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # (3) 필요한 라이브러리를 설치합니다.
      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # (4) 실제 수집 프로그램을 실행합니다.
      #     아래 SERVICE_KEY 등은 깃허브 Secrets 에 저장한 값을 가져다 씁니다.
      - name: 입찰정보 수집 및 메일 발송
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '0' }}
        run: python main.py

      # (5) 만들어진 엑셀 파일을 깃허브에도 보관합니다. (메일이 안 왔을 때 대비용)
      #     Actions 실행 결과 화면 맨 아래 'Artifacts' 에서 내려받을 수 있습니다.
      - name: 엑셀 파일 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bid-excel
          path: '*.xlsx'
          if-no-files-found: ignore
          retention-days: 30
